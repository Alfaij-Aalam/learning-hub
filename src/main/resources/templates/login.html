<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login - Learning Hub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, rgba(15,23,42,0.92), rgba(30,27,75,0.92)),
                        url('https://images.unsplash.com/photo-1516321318423-f06f85e504b3?q=80&w=1920&auto=format&fit=crop') no-repeat center center fixed !important;
            background-size: cover !important;
            color: #ffffff;
            font-family: 'Segoe UI', sans-serif;
            min-height: 100vh;
        }
        .glass-card {
            background: rgba(30, 41, 59, 0.9) !important;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center p-3">
    <div class="card glass-card p-4 p-md-5" style="max-width: 440px; width: 100%;">
        <div class="text-center mb-4">
            <div class="d-inline-block p-3 rounded-circle bg-primary bg-gradient mb-2 shadow">
                <i class="fa-solid fa-graduation-cap fa-2x text-white"></i>
            </div>
            <h3 class="fw-bold text-white mb-0">Learning Hub</h3>
            <p class="text-info small fw-bold mt-1">Smart Learning Portal</p>
        </div>
        
        <div th:if="${param.registered}" class="alert alert-success py-2 text-center small">Registration successful! Please login.</div>
        <div th:if="${error}" class="alert alert-danger py-2 text-center small" th:text="${error}"></div>
        
        <!-- Login Form -->
        <form action="/login" method="post" autocomplete="off" class="mb-3" id="loginForm">
            <div class="mb-3">
                <label class="form-label text-light small fw-bold"><i class="fa-solid fa-user me-1 text-info"></i> Email or Admin Name</label>
                <div class="input-group">
                    <span class="input-group-text bg-dark border-secondary text-info"><i class="fa-solid fa-envelope"></i></span>
                    <input type="text" name="identifier" id="identifierField" class="form-control bg-dark text-white border-secondary" required autocomplete="off" placeholder="Enter email or admin name">
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label text-light small fw-bold"><i class="fa-solid fa-lock me-1 text-info"></i> Password</label>
                <div class="input-group">
                    <span class="input-group-text bg-dark border-secondary text-info"><i class="fa-solid fa-key"></i></span>
                    <input type="password" name="password" id="passwordField" class="form-control bg-dark text-white border-secondary" required autocomplete="new-password" placeholder="Enter password">
                </div>
            </div>
            
            <!-- Alag se Student Login Button -->
            <button type="submit" class="btn btn-info w-100 fw-bold py-2 shadow-sm text-dark fs-6 mb-2">
                <i class="fa-solid fa-right-to-bracket me-1"></i> Student Login
            </button>
        </form>

        <!-- Register aur Admin Fill ke buttons -->
        <div class="d-flex gap-2">
            <a href="/register" class="btn btn-outline-warning w-50 btn-sm fw-bold py-2">
                <i class="fa-solid fa-user-plus me-1"></i> Register
            </a>
            <button type="button" onclick="fillAdminCredentials()" class="btn btn-outline-danger w-50 btn-sm fw-bold py-2 text-white">
                <i class="fa-solid fa-user-shield me-1"></i> Fill Admin
            </button>
        </div>
    </div>

    <script>
        function fillAdminCredentials() {
            document.getElementById('identifierField').value = 'Alfaiz Aalam';
            document.getElementById('passwordField').value = '898904';
        }
    </script>
</body>
</html>
