<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Course Subjects & Playlists</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #0f172a; color: #ffffff; font-family: 'Segoe UI', sans-serif; }
        .card-custom { background-color: #1e293b; border: 1px solid #334155; border-radius: 12px; }
    </style>
</head>
<body class="p-4">
    <div class="container">
        <!-- Header -->
        <div class="d-flex justify-content-between align-items-center mb-4 pb-3 border-bottom border-secondary">
            <h2 class="fw-bold text-info" th:text="${course.title}">Course Title</h2>
            <a href="/" class="btn btn-outline-light btn-sm"><i class="fa-solid fa-arrow-left me-1"></i>Back to Courses</a>
        </div>

        <p class="text-secondary mb-4" th:text="${course.description}">Course Description</p>

        <!-- Subjects List (10-12 Major Subjects) -->
        <h4 class="mb-3 text-warning"><i class="fa-solid fa-book-bookmark me-2"></i>Major Subjects & YouTube Playlists</h4>
        
        <div class="row g-3">
            <div class="col-md-12" th:each="subject : ${subjects}">
                <div class="card card-custom p-3 shadow">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <h5 class="fw-bold text-white mb-1" th:text="${subject.subjectName}">Subject Name</h5>
                            <p class="text-muted small m-0">YouTube Lecture Playlist available for this subject.</p>
                        </div>
                        <div>
                            <a th:href="${subject.youtubePlaylistUrl}" target="_blank" class="btn btn-sm btn-danger me-2">
                                <i class="fa-brands fa-youtube me-1"></i>Watch Playlist
                            </a>
                        </div>
                    </div>
                    
                    <!-- Programming / Frontend 20 Basic Examples Section -->
                    <div class="mt-3 pt-3 border-top border-secondary" th:if="${subject.basicPrograms != null}">
                        <h6 class="text-success"><i class="fa-solid fa-code me-2"></i>20 Basic Programs / Examples:</h6>
                        <pre class="bg-dark text-light p-2 rounded small" th:text="${subject.basicPrograms}"></pre>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
