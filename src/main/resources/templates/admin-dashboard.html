<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin Panel - Learning Hub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background: #0f172a; color: #ffffff; font-family: 'Segoe UI', sans-serif; min-height: 100vh; }
        .card-custom { background: #1e293b; border: 1px solid #334155; border-radius: 12px; }
    </style>
</head>
<body class="p-4">
    <div class="container-fluid">
        <header class="d-flex justify-content-between align-items-center mb-4 pb-3 border-bottom border-secondary">
            <div>
                <h3 class="fw-bold text-danger m-0"><i class="fa-solid fa-user-shield me-2"></i>Admin Panel - Student Database</h3>
                <p class="text-secondary small m-0 mt-1">Manage registered students and monitor platform access.</p>
            </div>
            <div>
                <a href="/" class="btn btn-outline-info btn-sm me-2 fw-bold"><i class="fa-solid fa-home me-1"></i> Dashboard View</a>
                <a href="/logout" class="btn btn-outline-danger btn-sm fw-bold"><i class="fa-solid fa-right-from-bracket me-1"></i> Logout</a>
            </div>
        </header>

        <div class="card card-custom p-4 shadow">
            <h5 class="fw-bold text-warning mb-3"><i class="fa-solid fa-users me-2"></i>Registered Students List</h5>
            <div class="table-responsive">
                <table class="table table-dark table-hover align-middle">
                    <thead>
                        <tr class="text-secondary small">
                            <th>ID</th>
                            <th>Full Name</th>
                            <th>Mobile</th>
                            <th>Email</th>
                            <th>Blood Group</th>
                            <th>Age</th>
                            <th>Role</th>
                            <th class="text-center">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="student : ${students}">
                            <td th:text="${student.id}">1</td>
                            <td class="fw-bold text-info" th:text="${student.fullName}">Name</td>
                            <td th:text="${student.mobileNumber}">Mobile</td>
                            <td th:text="${student.email}">Email</td>
                            <td th:text="${student.bloodGroup}">O+</td>
                            <td th:text="${student.age}">20</td>
                            <td><span class="badge bg-primary" th:text="${student.role}">STUDENT</span></td>
                            <td class="text-center">
                                <a th:href="@{'/admin/delete/' + ${student.id}}" class="btn btn-outline-danger btn-sm" onclick="return confirm('Are you sure you want to delete this student?');">
                                    <i class="fa-solid fa-trash me-1"></i> Delete
                                </a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
