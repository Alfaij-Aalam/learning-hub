<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Student Registration - Learning Hub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, rgba(15,23,42,0.92), rgba(30,27,75,0.92)),
                        url('https://images.unsplash.com/photo-1516321318423-f06f85e504b3?q=80&w=1920&auto=format&fit=crop') no-repeat center center fixed !important;
            background-size: cover !important;
            color: #ffffff;
            font-family: 'Segoe UI', sans-serif;
            min-height: 100vh;
        }
        .glass-card {
            background: rgba(30, 41, 59, 0.85) !important;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center p-3 py-5">
    <div class="card glass-card p-4 p-md-4 shadow" style="max-width: 480px; width: 100%;">
        <div class="text-center mb-3">
            <div class="d-inline-block p-3 rounded-circle bg-info bg-gradient mb-1 shadow">
                <i class="fa-solid fa-user-plus fa-2x text-dark"></i>
            </div>
            <h4 class="fw-bold text-white mb-0">Student Registration</h4>
        </div>
        
        <div th:if="${error}" class="alert alert-danger py-1 small text-center" th:text="${error}"></div>
        
        <form action="/register" method="post" autocomplete="off">
            <div class="mb-2">
                <label class="form-label small text-light fw-bold">Full Name</label>
                <input type="text" name="fullName" class="form-control bg-dark text-white border-secondary" required autocomplete="off">
            </div>
            <div class="mb-2">
                <label class="form-label small text-light fw-bold">Mobile Number</label>
                <input type="text" name="mobileNumber" class="form-control bg-dark text-white border-secondary" required autocomplete="off">
            </div>
            <div class="mb-2">
                <label class="form-label small text-light fw-bold">Email Address</label>
                <!-- Trick to prevent chrome autofill -->
                <input type="email" name="email" id="emailInput" class="form-control bg-dark text-white border-secondary" required autocomplete="off" readonly onfocus="this.removeAttribute('readonly');">
            </div>
            <div class="row mb-2">
                <div class="col">
                    <label class="form-label small text-light fw-bold">Blood Group</label>
                    <input type="text" name="bloodGroup" class="form-control bg-dark text-white border-secondary" placeholder="e.g. O+" required autocomplete="off">
                </div>
                <div class="col">
                    <label class="form-label small text-light fw-bold">Age</label>
                    <input type="number" name="age" class="form-control bg-dark text-white border-secondary" required autocomplete="off">
                </div>
            </div>
            <div class="mb-2">
                <label class="form-label small text-light fw-bold">Password</label>
                <input type="password" name="password" class="form-control bg-dark text-white border-secondary" required autocomplete="new-password">
            </div>
            <div class="mb-3">
                <label class="form-label small text-light fw-bold">Confirm Password</label>
                <input type="password" name="confirmPassword" class="form-control bg-dark text-white border-secondary" required autocomplete="new-password">
            </div>
            <button type="submit" class="btn btn-info w-100 fw-bold text-dark py-2 shadow-sm">Register Now</button>
        </form>
        
        <div class="text-center mt-3">
            <a href="/login" class="text-warning text-decoration-none small fw-bold">Already have an account? Login here</a>
        </div>
    </div>
</body>
</html>
